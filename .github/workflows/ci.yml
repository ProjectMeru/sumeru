name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-build:
    name: Go build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Build all packages
        run: go build ./...

  go-test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Unit tests and coverage gate
        env:
          GOFLAGS: -mod=readonly
        run: make test-go

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Standards
        run: make standards

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=10m

  go-vuln:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  swc:
    name: SWC check and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/swc
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: core/swc/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Vitest with coverage
        run: npm run test:coverage

  integration:
    name: Integration (PostgreSQL)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sumeru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sumeru_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Bootstrap base module and run integration tests
        env:
          SUMERU_TEST_DSN: host=localhost port=5432 user=postgres password=postgres dbname=sumeru_test sslmode=disable
        run: |
          make generate
          go run ./cmd/sumeru -- -c sumeru.conf.ci -i base --stop-after-init
          make test-integration

  generate:
    name: Generate drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Regenerate zimports.go
        run: make generate

      - name: Fail on uncommitted generated imports
        run: git diff --exit-code cmd/sumeru/zimports.go
