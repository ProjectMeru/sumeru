name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-build:
    name: Go build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.2"
          cache: true

      - name: Build all packages
        run: go build ./...

      - name: Job summary
        if: always()
        run: |
          echo "## Go build" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: \`go build ./...\`" >> "$GITHUB_STEP_SUMMARY"

  go-test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.2"
          cache: true

      - name: Module static tests
        env:
          GOFLAGS: -mod=readonly
        run: make test-modules-static

      - name: Run unit tests
        env:
          GOFLAGS: -mod=readonly
        run: go test ./test/... -count=1 -timeout 15m

      - name: Coverage gate
        env:
          GOFLAGS: -mod=readonly
          GO_COVERAGE_MIN: "42"
        run: |
          go test ./test/... -coverpkg=./... -coverprofile=coverage.out -count=1 -timeout 15m
          bash scripts/check_go_coverage.sh coverage.out

      - name: Job summary
        if: always()
        run: |
          echo "## Go test" >> "$GITHUB_STEP_SUMMARY"
          echo "Commands: \`make test-modules-static\`, \`go test ./test/...\`, coverage gate ${GO_COVERAGE_MIN:-42}%" >> "$GITHUB_STEP_SUMMARY"

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed for golangci-lint only-new-issues on pull_request.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.2"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Need a v2.x build that supports analyzing Go 1.26 modules.
          version: latest
          args: --timeout=10m
          only-new-issues: ${{ github.event_name == 'pull_request' }}

      - name: Job summary
        if: always()
        run: |
          echo "## Go lint" >> "$GITHUB_STEP_SUMMARY"
          echo "Commands: \`go vet ./...\`, \`govulncheck ./...\`, \`golangci-lint run\`" >> "$GITHUB_STEP_SUMMARY"

  swc:
    name: SWC check and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/swc
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: core/swc/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Vitest with coverage
        run: npm run test:coverage

      - name: Job summary
        if: always()
        run: |
          echo "## SWC" >> "$GITHUB_STEP_SUMMARY"
          echo "Commands: \`npm run check\`, \`npm run test\` (core/swc)" >> "$GITHUB_STEP_SUMMARY"

  generate:
    name: Generate drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.2"
          cache: true

      - name: Regenerate zimports.go
        run: make generate

      - name: Fail on uncommitted generated imports
        run: git diff --exit-code cmd/sumeru/zimports.go

      - name: Job summary
        if: always()
        run: |
          echo "## Generate" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: \`make generate\` — \`cmd/sumeru/zimports.go\` must match committed output." >> "$GITHUB_STEP_SUMMARY"

