<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Sumeru</title>
    {{range .Stylesheets}}
    <link rel="stylesheet" href="{{.}}">
    {{end}}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body class="sum-login-page">
<div class="sum-login-card">
    {{if .LogoURL}}
    <img src="{{.LogoURL}}" alt="" class="sum-login-logo"/>
    {{else}}
    <div class="sum-login-logo sum-login-logo--placeholder" aria-hidden="true">S</div>
    {{end}}
    
    <h1>Sign in</h1>
    <p class="sum-login-subtitle">Access your Sumeru workspace.</p>
    
    {{if .Error}}
    <div class="sum-login-error">{{.Error}}</div>
    {{end}}
    
    <form method="post" action="/web/login">
        <input type="hidden" name="next" value="{{.Next}}"/>
        
        <div class="field">
            <label for="login">Login</label>
            <input id="login" name="login" type="text" autocomplete="username" required autofocus placeholder="email@example.com"/>
        </div>
        
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"/>
        </div>
        
        <button type="submit" class="sum-login-btn">Sign in</button>
    </form>
</div>
<script>
(function () {
  localStorage.removeItem("sumeru_open_tabs");
})();
</script>
<script src="/static/js/sumeru-password-toggle.js"></script>
</body>
</html>
